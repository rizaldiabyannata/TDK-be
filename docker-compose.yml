services:
  redis:
    image: redis
    container_name: redis-tdk
    deploy:
      resources:
        limits:
          memory: 512M
    restart: always
    ports:
      - "0.0.0.0:6379:6379"
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf
      - redis-data:/data
    networks:
      - app-network

  mongo:
    image: mongo
    container_name: mongo-tdk
    deploy:
      resources:
        limits:
          memory: 2G
    restart: always
    ports:
      - "0.0.0.0:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-strongpassword123}
      MONGO_INITDB_DATABASE: tdk-db
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

  minio:
    image: minio/minio
    container_name: minio-tdk
    deploy:
      resources:
        limits:
          memory: 1G
    restart: always
    ports:
      - "0.0.0.0:9004:9000"
      - "0.0.0.0:9005:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

