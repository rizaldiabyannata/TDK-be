services:
  redis:
    image: redis
    container_name: redis-tdk
    deploy:
      resources:
        limits:
          memory: 512M
    restart: always
    expose:
      - "6379"
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf
      - redis-data:/data
    networks:
      - app-network

  mongo:
    image: mongo
    container_name: mongo-tdk
    deploy:
      resources:
        limits:
          memory: 2G
    restart: always
    expose:
      - "27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app-tdk
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      - redis
      - mongo
    env_file:
      - .env
    volumes:
      - uploads-data:/usr/src/app/public/uploads
      - logs-data:/usr/src/app/utils/logs
    networks:
      - app-network

volumes:
  redis-data:
  mongo-data:
  uploads-data:
  logs-data:

networks:
  app-network:
    driver: bridge
