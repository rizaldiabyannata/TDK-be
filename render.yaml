services:
  # Main Express.js Web Service
  - type: web
    runtime: node
    name: tdk-backend
    region: singapore
    plan: starter
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/runtime
    maxShutdownDelaySeconds: 30
    envVars:
      - key: BUN_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        fromDatabase:
          name: tdk-mongodb
          property: connectionString
      - key: REDIS_HOST
        fromService:
          name: tdk-redis
          type: keyvalue
          property: host
      - key: REDIS_PORT
        fromService:
          name: tdk-redis
          type: keyvalue
          property: port
      - key: REDIS_PASSWORD
        sync: false
      - key: REDIS_DB
        value: 0
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: MINIO_ENDPOINT
        sync: false
      - key: MINIO_PORT
        sync: false
      - key: MINIO_ACCESS_KEY
        sync: false
      - key: MINIO_SECRET_KEY
        sync: false
      - key: MINIO_BUCKET
        value: tdk-uploads
      - key: ORIGIN_WHITELIST
        sync: false

  # Redis Key-Value Store
  - type: keyvalue
    name: tdk-redis
    region: singapore
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList:
      - source: 0.0.0.0/0
        description: Allow all connections

# PostgreSQL Database (if needed in future)
# Uncomment if you want to add PostgreSQL alongside MongoDB
# databases:
#   - name: tdk-postgres
#     region: singapore
#     plan: basic-256mb
#     databaseName: tdk_db
#     user: tdk_user

# MongoDB Database
# Note: Render doesn't natively support MongoDB, so you'll need to use:
# 1. MongoDB Atlas (recommended) - update MONGO_URI to Atlas connection string
# 2. External MongoDB provider
# 3. Self-hosted MongoDB on a separate service
databases:
  - name: tdk-mongodb
    region: singapore
    plan: basic-256mb
    databaseName: tdk_db
    user: tdk_user
    ipAllowList:
      - source: 0.0.0.0/0
        description: Allow all connections

# Environment Groups (optional - for shared variables)
envVarGroups:
  - name: tdk-common
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
